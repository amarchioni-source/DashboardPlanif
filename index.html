<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANB Planificación Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f9;color:#1a1a2e;font-size:13px}
.hdr{background:linear-gradient(135deg,#0d0d0d 0%,#1a1a1a 60%,#251a08 100%);padding:14px 24px;color:#fff;display:flex;align-items:center;gap:16px;border-bottom:3px solid #c8a84b;position:relative;min-height:56px}
.hdr h1{font-size:15px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#fff}
.hdr p{font-size:9px;opacity:.55;letter-spacing:1.5px;text-transform:uppercase;color:#c8a84b}
.hdr::after{content:"AZUL NATURAL BEEF";position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:9px;letter-spacing:4px;color:#c8a84b;font-weight:700;text-transform:uppercase}
.snav{background:#111;padding:6px 18px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #2a2a2a}
.snl{font-size:9px;color:#c8a84b;text-transform:uppercase;letter-spacing:1px;margin-right:4px;font-weight:700}
.sp{padding:4px 12px;border-radius:20px;border:1px solid #333;cursor:pointer;font-size:11px;font-weight:500;color:#aaa;background:none;transition:all .15s;white-space:nowrap}
.sp:hover{border-color:#c8a84b;color:#c8a84b}
.sp.on{background:#c8a84b;border-color:#c8a84b;color:#000;font-weight:700}
.sp.con{background:#1a5276;border-color:#1a5276;color:#fff}
.layout{display:flex;height:calc(100vh - 200px);min-height:500px}
.sb{width:230px;flex-shrink:0;background:#fff;border-right:1px solid #dde3ea;display:flex;flex-direction:column}
.sbh{padding:10px 12px;border-bottom:1px solid #e1e8ef;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#f8fafc}
.sbt{font-size:12px;font-weight:600;color:#1a3a5c}.sbn{background:#1a3a5c;color:#8ab4d4;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.mbfrow{padding:6px 10px;border-bottom:1px solid #e1e8ef;display:flex;gap:4px;align-items:center;flex-shrink:0;background:#f8fafc}
.mbt{padding:3px 10px;border-radius:12px;border:1px solid #c8d8e8;cursor:pointer;font-size:10px;font-weight:600;color:#666;background:#fff}
.mbt.on{color:#fff;border-color:transparent}
.sbs{padding:6px 10px;border-bottom:1px solid #e1e8ef;flex-shrink:0}
.sbs input{width:100%;font-size:11px;padding:5px 8px;border:1px solid #c8d8e8;border-radius:6px;background:#fff;color:#333;outline:none}
.sbs input:focus{border-color:#1a5276}
.sbl{overflow-y:auto;flex:1}
.gi{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f0f4f8;transition:background .1s}
.gi:hover{background:#f0f7ff}
.gi.on{background:#deeaf8;border-left:3px solid #1a3a5c}
.gi.con{background:#deeaf8;border-left:3px solid #1a5276}
.gi.cong-row{border-left:3px solid #1a3a5c}
.gin{font-size:11px;font-weight:600;margin-bottom:3px;color:#1a2a3a}
.gim{font-size:10px;color:#666;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gib{height:4px;background:#e8eef4;border-radius:2px;overflow:hidden;margin-top:4px}
.gibf{height:100%;border-radius:2px}
.sbadge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;color:#fff}
.main{flex:1;overflow-y:auto;padding:16px;background:#f4f6f9}
.kr{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid #e1e8ef;border-radius:9px;padding:11px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kn{font-size:25px;font-weight:800;line-height:1;margin-bottom:4px;font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.kl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.6px;font-weight:600}.u{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#c8a84b;text-transform:uppercase}
.lg{display:flex;gap:12px;flex-wrap:wrap;padding:7px 12px;background:#fff;border:1px solid #e1e8ef;border-radius:8px;margin-bottom:12px}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#555}
.ld{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.sc{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #e1e8ef}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.oc{background:#fff;border:1px solid #e1e8ef;border-radius:9px;padding:12px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.oc:hover{border-color:#1a5276;box-shadow:0 2px 8px rgba(26,82,118,.15);transform:translateY(-1px)}
.ocn{font-size:12px;font-weight:600;margin-bottom:4px;color:#1a2a3a}
.ocm{font-size:10px;color:#888;margin-bottom:7px}
.mwg{display:flex;flex-wrap:wrap;gap:2px}
.mw{width:12px;height:10px;border-radius:2px}
.wr{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:12px}
.wc{width:30px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;cursor:default;flex-shrink:0;color:#fff}
.wc:hover{transform:scale(1.15);z-index:20}
.bk{border:none;background:none;cursor:pointer;color:#555;font-size:12px;padding:0 0 10px;display:flex;align-items:center;gap:5px;font-weight:500}
.bk:hover{color:#1a3a5c}
.dc{background:#fff;border:1px solid #e1e8ef;border-radius:9px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.dn{font-size:15px;font-weight:700;margin-bottom:4px;color:#1a2a3a}
.ds{font-size:11px;color:#888;margin-bottom:12px}
.wdr{display:flex;align-items:flex-start;gap:6px;padding:5px 6px;border-bottom:1px solid #f0f4f8}
.wdr:last-child{border:none}
.wds{font-weight:700;width:27px;color:#888;flex-shrink:0;font-size:10px;padding-top:3px}
.wdp{font-size:10px;color:#aaa;width:65px;flex-shrink:0;padding-top:3px}
.wde{display:flex;gap:4px;flex-wrap:wrap}
.ep{display:flex;align-items:center;gap:3px;padding:3px 7px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.mb-tag{font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.cc{background:#fff;border:1px solid #e1e8ef;border-radius:9px;padding:12px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cc:hover{border-color:#1a5276;box-shadow:0 2px 8px rgba(26,82,118,.15);transform:translateY(-1px)}
.cc.on{border:2px solid #1a5276}
.cc.cong-card{border-left:4px solid #1a3a5c}
.ccn{font-size:11px;font-weight:700;margin-bottom:2px;color:#1a2a3a;line-height:1.3}
.ccp{font-size:10px;color:#888;margin-bottom:5px}
.cck{font-size:18px;font-weight:700;color:#1a5276;margin-bottom:4px}
.prc{border:1px solid #e1e8ef;border-radius:8px;margin-bottom:7px;overflow:hidden;background:#fff}
.prh{padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .1s}
.prh:hover{background:#f0f7ff}
.prn{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;color:#1a2a3a;flex-wrap:wrap}
.prmeta{font-size:11px;color:#888;display:flex;align-items:center;gap:6px;white-space:nowrap}
.prbody{padding:12px 14px;border-top:1px solid #e1e8ef;background:#f8fafc}
.sol-hdr{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
.sol-badge{font-size:9px;font-weight:800;padding:3px 9px;border-radius:10px;color:#fff}
.cwc{width:26px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}

/* ===== MOVIL (no toca el escritorio) ===== */
@media (max-width:760px){
  body{font-size:14px}
  .hdr{padding:10px 14px;min-height:auto;flex-wrap:wrap;gap:6px}
  .hdr h1{font-size:13px;letter-spacing:1.5px}
  .hdr::after{display:none}
  #ticker{padding:4px 10px}
  .snav{padding:8px 10px;gap:6px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .sp{padding:7px 13px;font-size:13px;flex-shrink:0}
  .snl{flex-shrink:0}
  /* sidebar arriba, contenido abajo */
  .layout{flex-direction:column;height:auto;min-height:0}
  .sb{width:100%;max-height:42vh;border-right:none;border-bottom:2px solid #dde3ea}
  .sbl{max-height:30vh}
  .main{padding:12px 10px;overflow-y:visible}
  /* tarjetas y grillas */
  .kr{grid-template-columns:repeat(2,1fr)}
  .kn{font-size:21px}
  .og,.cg{grid-template-columns:1fr 1fr}
  /* tablas y grilla de semanas: scroll horizontal con el dedo */
  .main table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  /* botones/areas tocables mas comodos */
  .gi{padding:11px 12px}
  .mbt{padding:6px 12px;font-size:12px}
}
@media (max-width:430px){
  .kr{grid-template-columns:1fr 1fr}
  .og,.cg{grid-template-columns:1fr}
  .hdr p{display:none}
}
</style>

<body>
<div class="hdr">
  <h1>ANB · Planificación</h1>
  <p id="hdr-sub">Solapas &nbsp;·&nbsp; Clientes &nbsp;·&nbsp; <span id="hdr-weeks">—</span></p>
</div>
<div id="sticky-top" style="position:sticky;top:0;z-index:200;background:#0a0a0a">
<div id="ticker" style="background:#0a0a0a;border-bottom:1px solid #222;padding:4px 18px;display:flex;gap:12px;align-items:center;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;min-height:26px">
  <span style="font-size:9px;letter-spacing:2px;color:#c8a84b;font-weight:700;text-transform:uppercase;flex-shrink:0">COTIZACIONES</span>
  <div id="ticker-items" style="display:flex;gap:10px;flex-wrap:nowrap;align-items:center;flex:1">
    <span style="font-size:10px;color:#555">Cargando...</span>
  </div>
  <span id="ticker-time" style="font-size:9px;color:#444;margin-left:auto;flex-shrink:0"></span>
</div>

<script>
(function loadRates(){
  const items = document.getElementById('ticker-items');
  const timeEl = document.getElementById('ticker-time');
  if(!items) return;

  // Color helper
  function rateEl(label, val, flag, decimals=2){
    return `<span style="display:flex;align-items:center;gap:4px">
      <span style="font-size:12px">${flag}</span>
      <span style="font-size:9px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px">${label}</span>
      <span style="font-size:11px;font-weight:700;color:#e8e0cc">${val}</span>
    </span>`;
  }

  function fmt(n, dec=2){ return n ? parseFloat(n).toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec}) : '—'; }

  // Elemento con compra/venta (para la tabla de billetes BNA)
  function cvEl(label, compra, venta, flag){
    return `<span style="display:flex;align-items:center;gap:4px">
      <span style="font-size:12px">${flag}</span>
      <span style="font-size:9px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px">${label}</span>
      <span style="font-size:9px;color:#6f9f6f;font-weight:700">C</span><span style="font-size:11px;font-weight:700;color:#cfe6cf">${compra}</span>
      <span style="font-size:9px;color:#b08a4a;font-weight:700">V</span><span style="font-size:11px;font-weight:700;color:#e8e0cc">${venta}</span>
    </span>`;
  }

  async function fetchAll(){
    let out = '';
    const sep = '<span style="color:#333;margin:0 4px">·</span>';

    try {
      // Tipos de cambio internacionales
      const r1 = await fetch('https://open.er-api.com/v6/latest/USD');
      const d1 = await r1.json();
      const rates = d1.rates || {};

      // Cotizaciones ARG via dolarapi.com (blue, mep, turista, cripto, mayorista=divisa BNA, oficial de respaldo)
      let blue='—', mep='—', turista='—', cripto='—', ofC='—', ofV='—', mayC='—', mayV='—';
      try {
        const r2 = await fetch('https://dolarapi.com/v1/dolares');
        const d2 = await r2.json();
        for(const d of d2){
          const n = (d.nombre||d.casa||'').toLowerCase();
          if(n.includes('blue'))    blue    = '$ '+fmt(d.venta,0);
          if(n.includes('oficial')){ ofC='$ '+fmt(d.compra,0); ofV='$ '+fmt(d.venta,0); }
          if(n.includes('mayorista')){ mayC='$ '+fmt(d.compra,0); mayV='$ '+fmt(d.venta,0); }
          if(n.includes('bolsa')||n.includes('mep')) mep = '$ '+fmt(d.venta,0);
          if(n.includes('tarjeta')||n.includes('turista')) turista = '$ '+fmt(d.venta,0);
          if(n.includes('cripto')) cripto  = '$ '+fmt(d.venta,0);
        }
      } catch(e2){}

      // BNA — Cotización Billetes. Dólar exacto desde bna.com.ar (scraping); Euro y Real oficiales (dolarapi).
      let usdC='—', usdV='—', eurC='—', eurV='—', realC='—', realV='—', bnaHora='';
      try {
        const rb = await fetch('https://dolar-bna.vercel.app/api/cotizacion');
        const db = await rb.json();
        if(db && db.venta){ usdC='$ '+fmt(db.compra,0); usdV='$ '+fmt(db.venta,0); }
      } catch(eb){}
      if(usdV==='—'){ usdC=ofC; usdV=ofV; }   // respaldo: oficial dolarapi
      try {
        const re = await fetch('https://dolarapi.com/v1/cotizaciones/eur');
        const de = await re.json();
        if(de && de.venta){ eurC='$ '+fmt(de.compra,0); eurV='$ '+fmt(de.venta,0);
          if(de.fechaActualizacion) bnaHora=new Date(de.fechaActualizacion).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
      } catch(ee){}
      try {
        const rr = await fetch('https://dolarapi.com/v1/cotizaciones/brl');
        const dr = await rr.json();
        if(dr && dr.venta){ realC='$ '+fmt(dr.compra,0); realV='$ '+fmt(dr.venta,0); }
      } catch(er){}

      // Bitcoin via CoinGecko
      let btc = '—';
      try {
        const r3 = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
        const d3 = await r3.json();
        btc = 'U$S '+parseInt(d3.bitcoin?.usd||0).toLocaleString('es-AR');
      } catch(e3){}

      // Armar ticker — BNA Divisas (dólar = mayorista) primero, luego Billetes
      out += `<span style="font-size:9px;color:#c8a84b;font-weight:700;letter-spacing:1px">🏦 BNA · DIVISAS</span>` + sep;
      out += cvEl('Dólar', mayC, mayV, '🇺🇸') + sep;
      out += `<span style="font-size:9px;color:#c8a84b;font-weight:700;letter-spacing:1px">🏦 BNA · BILLETES${bnaHora?` <span style="opacity:.6;font-weight:600">${bnaHora}</span>`:''}</span>` + sep;
      out += cvEl('Dólar', usdC, usdV, '🇺🇸') + sep;
      out += cvEl('Euro', eurC, eurV, '🇪🇺') + sep;
      out += cvEl('Real', realC, realV, '🇧🇷') + sep;
      out += '<span style="font-size:9px;color:#c8a84b;font-weight:700;letter-spacing:1px">📈 MERCADO</span>' + sep;
      out += rateEl('Blue', blue, '💵') + sep;
      out += rateEl('MEP', mep, '📊') + sep;
      out += rateEl('Turista', turista, '✈️') + sep;
      out += rateEl('Cripto', cripto, '💻') + sep;
      out += rateEl('BTC', btc, '₿') + sep;
      out += '<span style="font-size:9px;color:#c8a84b;font-weight:700;letter-spacing:1px">🌍 INTL</span>' + sep;
      const eur = rates.EUR ? fmt(1/rates.EUR) : '—';
      out += rateEl('EUR', eur, '🇪🇺') + sep;
      out += rateEl('BRL', fmt(rates.BRL), '🇧🇷') + sep;
      out += rateEl('CNY', fmt(rates.CNY), '🇨🇳') + sep;
      out += rateEl('CLP', fmt(rates.CLP,0), '🇨🇱') + sep;
      out += rateEl('MYR', fmt(rates.MYR), '🇲🇾') + sep;
      out += rateEl('PEN', fmt(rates.PEN), '🇵🇪');

    } catch(e){
      out = '<span style="font-size:10px;color:#c0392b">⚠ Error: '+e.message+'</span>';
    }

    items.innerHTML = out;
    const now = new Date();
    timeEl.textContent = 'Actualizado ' + now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }

  fetchAll();
  setInterval(fetchAll, 5 * 60 * 1000); // refresh cada 5 min
})();
</script>

  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 120% 200% at 50% 50%,rgba(40,30,15,.0) 0%,rgba(10,8,4,.5) 100%);mix-blend-mode:multiply"></div>

<script>

function celCol(es,p){
  // Color por % COLOCADO = (venta + pool + reserva) / produccion. Verde solo si casi no sobra.
  const asign=es?es.reduce((a,e)=>a+e.kg,0):0;
  if(p>0){
    const pct=asign/p;
    if(pct>=0.95) return CV;     // falta <=5%   -> verde (colocado)
    if(pct>=0.70) return CPART;  // falta 5-30%  -> amarillo
    if(pct>=0.40) return CNF;    // falta 30-60% -> naranja fuerte
    return CN_;                  // falta +60%   -> rojo
  }
  if(!es||!es.length) return CN_;
  return CV;                     // sin produccion pero con algo asignado
}

  const totV=gens.reduce((a,g)=>a+Object.values(sol.g[g].w).reduce((b,w)=>b+w.e.filter(e=>e.t==='V').reduce((c,e)=>c+e.kg,0),0),0);
  const totR=gens.reduce((a,g)=>a+Object.values(sol.g[g].w).reduce((b,w)=>b+w.e.filter(e=>e.t==='R').reduce((c,e)=>c+e.kg,0),0),0);
  const totP=gens.reduce((a,g)=>a+Object.values(sol.g[g].w).reduce((b,w)=>b+w.p,0),0);
  const pct=totP>0?Math.round(totV/totP*100):0;
  const cards=gens.map((g,i)=>{
    const gd=sol.g[g];
    const tv=Object.values(gd.w).reduce((a,w)=>a+w.e.filter(e=>e.t==='V').reduce((b,e)=>b+e.kg,0),0);
    const lv=gd.lv?parseInt(gd.lv.slice(1)):null;
    const hasR=Object.values(gd.w).some(w=>w.e.some(e=>e.t==='R'));
    const isMB2=g.includes('__MB2');
  const esMB2RLW = isMB2 && curSol==='R&L W';
    const cells=WK.map(wn=>{const wd=gd.w[`W${wn}`];return`<div class="mw" style="background:${wd?celCol(wd.e,wd.p):CN_}" title="W${wn}${wd?' prod:'+fmt(wd.p)+'kg':''}"></div>`;}).join('');
    return`<div class="oc" onclick="selGen(${i})">
      <div class="ocn">${g.replace(/^G /,'').replace('__MB2','')}${isMB2?` <span class="mb-tag" style="background:#6C3483;color:#fff">MB2</span>`:''}${hasR?` <span style="color:#e67e22;font-size:9px">●</span>`:''}</div>
      <div class="ocm">${fmtK(tv)} · ${lv?`hasta W${lv}`:'sin ventas'}</div>
      <div class="mwg">${cells}</div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`
    ${mbBarHTML()}
    <div class="kr">
      <div class="kpi"><div class="kn" style="color:${color}">${kK(totP)}${UKG}</div><div class="kl">Producción</div></div>
      <div class="kpi"><div class="kn" style="color:${CV}">${kK(totV)}${UKG}</div><div class="kl">Vendido</div></div>
      ${totR>0?`<div class="kpi"><div class="kn" style="color:${CR}">${kK(totR)}${UKG}</div><div class="kl">Reservado</div></div>`:''}
      <div class="kpi"><div class="kn">${pct}%</div><div class="kl">Asignado</div></div>
    </div>
    <div class="lg">
      <div class="li"><div class="ld" style="background:${CV}"></div>Colocado (falta ≤5%)</div>
      <div class="li"><div class="ld" style="background:${CPART}"></div>Falta 5–30%</div>
      <div class="li"><div class="ld" style="background:${CNF}"></div>Falta 30–60%</div>
      <div class="li"><div class="ld" style="background:${CN_}"></div>Falta +60%</div>
    </div>
    <div class="sc">Genéricos — clic para ver destinos semana a semana</div>
    <div class="og">${cards}</div>`;
}

function renderGenDet(){
  const g=visG()[curGenIdx]; if(!g) return;
  const gd=SOL[curSol].g[g];
  const isMB2=g.includes('__MB2');
  const lv=gd.lv?parseInt(gd.lv.slice(1)):null;
  const tv=Object.values(gd.w).reduce((a,w)=>a+w.e.filter(e=>e.t==='V').reduce((b,e)=>b+e.kg,0),0);
  const tp=Object.values(gd.w).reduce((a,w)=>a+w.p,0);
  const cells=WK.map(wn=>{
    const wd=gd.w[`W${wn}`],bg=wd?celCol(wd.e,wd.p):CN_;
    const tip=wd?`W${wn} | prod: ${fmt(wd.p)}kg | `+wd.e.map(e=>`${e.p||e.c} ${fmt(e.kg)}kg`).join(' | '):`W${wn}`;
    return`<div class="wc" style="background:${bg};${lv===wn?'outline:2px solid #333;outline-offset:1px':''}" title="${tip}">${wn}</div>`;
  }).join('');
  const rows=WK.map(wn=>{
    const wd=gd.w[`W${wn}`]; if(!wd) return '';
    const past=lv&&wn>lv;
    const vendido=wd.e.reduce((a,e)=>a+e.kg,0);
    const saldo=wd.p-vendido;
    const pct=wd.p>0?Math.round(vendido/wd.p*100):0;
    const pills=wd.e.map(e=>{
      const tc=e.t==='R'?CR:CV;
      const tag=e.t==='R'?' RES':e.t==='C'?' POOL':'';
      return`<span class="ep" style="background:${e.t==='R'?'rgba(230,126,34,.12)':'rgba(39,174,96,.12)'};color:${tc}">${e.f?`${fe(e.f)} `:''}${(e.p||e.c||'Menaker').slice(0,18)} <b>${fmt(e.kg)}kg</b><span style="opacity:.5;font-size:9px">${tag}</span></span>`;
    }).join('');
    const barColor=pct===0?CN_:pct<50?'#e67e22':pct<90?CV:CV;
    // MB2 de R&L W: saldo = degradado a MB1, no es hueco real
    const degradadoMB2 = esMB2RLW && saldo > 0;
    const alertaHtml = degradadoMB2
      ? `<div style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;margin-top:4px;background:rgba(39,174,96,.12);color:#1e8449;border:0.5px solid rgba(39,174,96,.3)">
          ✓ <span>${fmt(saldo)} kg vendidos como MB1</span>
        </div>`
      : saldo>0&&wd.p>0?`
      <div style="display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:5px;font-size:10px;font-weight:600;margin-top:4px;background:${pct===0?'rgba(192,57,43,.1)':'rgba(230,126,34,.1)'};color:${pct===0?'#922b21':'#b7600a'};border:0.5px solid ${pct===0?'rgba(192,57,43,.35)':'rgba(230,126,34,.35)'}">
        <i class="ti ti-alert-triangle" style="font-size:13px" aria-hidden="true"></i>
        <span><b>${fmt(saldo)} kg sin asignar</b> &mdash; ${pct}% vendido</span>
      </div>`:'';
    // saldo a mostrar en el indicador derecho: 0 si es degradado
    const saldoDisplay = degradadoMB2 ? 0 : saldo;
    return`<div class="wdr" style="${past?'opacity:.3':''}${saldoDisplay>wd.p*.5&&!past?'background:rgba(192,57,43,.03);border-radius:5px':''}" >
      <div class="wds">W${wn}</div>
      <div style="width:68px;flex-shrink:0;padding-top:2px">
        <div style="font-size:10px;color:var(--color-text-secondary)">${wd.p?fmt(wd.p)+'kg':'—'}</div>
        ${wd.p>0?`<div style="height:4px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden;margin-top:2px"><div style="height:100%;width:${pct}%;background:${barColor};border-radius:2px"></div></div>`:''}
      </div>
      <div class="wde" style="flex:1">
        ${pills||(wd.p>0?`<span style="font-size:10px;color:${CN_};font-weight:600">sin venta asignada</span>`:'')}
        ${alertaHtml}
      </div>
      ${saldoDisplay>0&&wd.p>0?`<div style="font-size:11px;font-weight:700;color:${pct<50?CN_:'#e67e22'};white-space:nowrap;padding-top:2px">+${fmt(saldoDisplay)}</div>`:''}
    </div>`;
  }).filter(Boolean).join('');
  document.getElementById('main').innerHTML=`
    <button class="bk" onclick="selGen(-1)">← ${curSol}</button>
    <div class="dc">
      <div class="dn">${g.replace(/^G /,'').replace('__MB2','')}${isMB2?` <span class="mb-tag" style="background:#6C3483;color:#fff">MB2</span>`:''} <span style="font-size:12px;color:#aaa;font-weight:400">· ${gd.kgu} kg/unid</span></div>
      <div class="ds">${curSol} · prod. ${fmtK(tp)} · vendido ${fmtK(tv)} · ${lv?`última venta W${lv}`:'sin ventas'}</div>
      <div class="wr">${cells}</div>
      <div class="sc">Semana · producción · destinos</div>
      <div>${rows}</div>
    </div>`;
}

function renderCliOv(){
  const ks=CNAMES.map((n,i)=>{return{n,i,d:CLI[i]};}).filter(x=>!srch||x.n.toLowerCase().includes(srch)).sort((a,b)=>b.d.kg-a.d.kg);
  const totKg=ks.reduce((a,x)=>a+x.d.kg,0);
  const nEnf=ks.filter(x=>x.d.tipo==='enfriado').length;
  const nCong=ks.filter(x=>x.d.tipo==='congelado').length;
  const cards=ks.map(x=>{
    const d=x.d; const isCong=d.tipo==='congelado';
    const strip=WK.map(wn=>{
      let hasV=false;
      for(const sd of Object.values(d.solapas)){
        for(const gd of sd.gens){if((gd.sem[String(wn)]||0)>0){hasV=true;break;}}
        if(hasV) break;
      }
      return`<div class="mw" style="background:${hasV?CV:CN_}"></div>`;
    }).join('');
    const nCli=d.clientes?d.clientes.length:0;
    return`<div class="cc${x.i===curCliIdx?' on':''}${isCong?' cong-card':''}" onclick="selCli(${x.i})">
      <div class="ccn">${d.flag?`${fe(d.flag)} `:''}${x.n}</div>
      <div class="ccp">${d.pais||'—'} · ${isCong?'❄ '+nCli+' clientes':'● Enfriado'}</div>
      <div style="margin-bottom:5px">${Object.keys(d.solapas).map(s=>`<span class="sbadge" style="background:${SC[s]||'#555'}">${s.replace('R&L ','')}</span>`).join(' ')}</div>
      <div class="mwg">${strip}</div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`
    <div class="kr">
      <div class="kpi"><div class="kn" style="color:#1a5276">${kK(totKg)}${UKG}</div><div class="kl">Total</div></div>
      <div class="kpi"><div class="kn">${nEnf}</div><div class="kl">Enfriado</div></div>
      <div class="kpi"><div class="kn">${nCong}</div><div class="kl">Cong. países</div></div>
    </div>
    <div class="lg">
      <div class="li"><div class="ld" style="background:${CV}"></div>Semana con venta</div>
      <div class="li"><div class="ld" style="background:${CN_}"></div>Sin venta</div>
      <div class="li"><span style="border-left:4px solid #1a3a5c;padding-left:5px;font-size:10px">= Congelado agrupado por país</span></div>
    </div>
    <div class="sc">Clientes — clic para ver productos y semanas</div>
    <div class="cg">${cards}</div>`;
}

function renderCliDet(){
  const cname=CNAMES[curCliIdx], d=CLI[curCliIdx]; if(!d) return;
  const isCong=d.tipo==='congelado';
  const lastWn=Math.max(...Object.values(d.solapas).flatMap(s=>s.gens.flatMap(g=>Object.keys(g.sem).map(Number))));
  const totalG=Object.values(d.solapas).reduce((a,s)=>a+s.gens.length,0);

  // Si es congelado, mostrar lista de clientes reales al tope
  const clientesHtml=isCong&&d.clientes?`
    <div style="margin-bottom:12px;padding:10px 12px;background:#f0f4fa;border-radius:8px;border:1px solid #d0daea">
      <div style="font-size:10px;font-weight:700;color:#1a3a5c;text-transform:uppercase;margin-bottom:6px">❄ Clientes agrupados (${d.clientes.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${d.clientes.map(c=>`<span style="font-size:10px;background:#fff;border:1px solid #c0d0e0;border-radius:4px;padding:2px 7px;color:#333">${c}</span>`).join('')}</div>
    </div>`:'';

  const sections=Object.entries(d.solapas).sort((a,b)=>b[1].kg-a[1].kg).map(([sol,sd])=>{
    const color=SC[sol]||'#555';
    const genRows=sd.gens.sort((a,b)=>b.kg-a.kg).map((gd,gi)=>{
      const key=`${curCliIdx}_${sol}_${gi}`;
      const isOpen=openGenKey===key;
      const isMB2=gd.g.includes('__MB2');
      const genBase=gd.g.replace('__MB2','');
      const short=gd.g.replace(/^G /,'').replace('__MB2',' (MB2)');
      const solData=SOL[sol]&&SOL[sol].g&&SOL[sol].g[genBase];
      const strip=WK.map(wn=>{
        const kgV=gd.sem[String(wn)]||0;
        const wd=solData&&solData.w[`W${wn}`];
        const bg=kgV>0?CV:CN_;
        return`<div class="cwc" style="background:${bg}" title="W${wn}: ${kgV?fmt(kgV)+' kg':'sin venta'}${wd?' | prod: '+fmt(wd.p)+'kg':''}">${wn}</div>`;
      }).join('');
      let body='';
      if(isOpen){
        const misSems=Object.entries(gd.sem).filter(([,kg])=>kg>0).sort((a,b)=>parseInt(a[0])-parseInt(b[0]));
        body=`<div class="prbody">
          <div style="font-size:11px;font-weight:600;margin-bottom:8px;color:#555">W25→W44 — <span style="color:${CV}">■ con venta</span> · <span style="color:${CN_}">■ sin venta</span></div>
          <div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:12px">${strip}</div>`;
        if(misSems.length){
          body+=`<div style="font-size:10px;font-weight:700;margin-bottom:6px;color:#888;text-transform:uppercase">Semanas con venta</div>`;
          body+=misSems.map(([wn,kg])=>{
            const wd=solData&&solData.w[`W${wn}`];
            return`<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #e8eef4;align-items:center">
              <span style="font-weight:700;color:#888;width:30px;font-size:11px">W${wn}</span>
              <span style="color:${CV};font-weight:700;font-size:13px">${fmt(kg)} kg</span>
              <span style="color:#aaa;font-size:10px">prod. total: ${wd?fmt(wd.p)+'kg':'—'}</span>
            </div>`;
          }).join('');
        }
        if(solData){
          body+=`<div style="font-size:10px;font-weight:700;margin:12px 0 6px;color:#888;text-transform:uppercase">Todos los destinos · ${sol} · ${genBase}</div>`;
          body+=WK.map(wn=>{
            const wd=solData.w[`W${wn}`]; if(!wd||(!wd.p&&!wd.e.length)) return '';
            const bg=celCol(wd.e,wd.p);
            const myKg=gd.sem[String(wn)]||0;
            const pills=wd.e.map(e=>{
              const tc=e.t==='R'?CR:CV;
              const tag=e.t==='R'?' RES':e.t==='C'?' POOL':'';
              const isMe=myKg>0&&e.t==='V';
              return`<span class="ep" style="background:${isMe?'rgba(39,174,96,.2)':e.t==='R'?'rgba(230,126,34,.1)':'rgba(39,174,96,.07)'};color:${tc};${isMe?'outline:1.5px solid #27ae60;outline-offset:1px':''}">
                ${e.f?`${fe(e.f)} `:''}<span>${(e.p||e.c||'Menaker').slice(0,18)}</span> <b>${fmt(e.kg)}kg</b><span style="opacity:.5;font-size:9px">${tag}</span>
              </span>`;
            }).join('');
            return`<div style="display:flex;gap:5px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #f0f4f8">
              <div style="width:8px;height:8px;border-radius:2px;background:${bg};flex-shrink:0;margin-top:4px"></div>
              <span style="font-weight:700;color:#888;width:28px;font-size:10px">W${wn}</span>
              <span style="font-size:10px;color:#aaa;width:62px;flex-shrink:0">${fmt(wd.p)}kg</span>
              <div style="display:flex;gap:3px;flex-wrap:wrap">${pills||(wd.p>0?`<span style="font-size:10px;color:${CN_};font-weight:600">sin venta</span>`:'')}</div>
            </div>`;
          }).filter(Boolean).join('');
        }
        body+='</div>';
      }
      return`<div class="prc">
        <div class="prh" onclick="toggleGen('${key}')">
          <div class="prn">
            ${isMB2?`<span class="mb-tag" style="background:#6C3483;color:#fff">MB2</span>`:''}
            ${short}
            ${tempBadge(gd.temp)}
          </div>
          <div class="prmeta"><span style="color:#1a5276;font-weight:700">${fmtK(gd.kg)}</span><span style="font-size:14px">${isOpen?'▲':'▼'}</span></div>
        </div>
        ${body}
      </div>`;
    }).join('');
    return`<div>
      <div class="sol-hdr"><span class="sol-badge" style="background:${color}">${sol}</span><span style="font-size:12px;font-weight:700">${fmtK(sd.kg)}</span></div>
      ${genRows}
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML=`
    <button class="bk" onclick="selCli(-1)">← Clientes</button>
    <div class="dc">
      <div class="dn">${d.flag?`${fe(d.flag)} `:''}${cname} ${isCong?'<span style="font-size:11px;background:#1a3a5c;color:#fff;padding:2px 8px;border-radius:4px;font-weight:600">❄ Congelado</span>':'<span style="font-size:11px;background:#1E8449;color:#fff;padding:2px 8px;border-radius:4px;font-weight:600">● Enfriado</span>'}</div>
      <div class="ds">${d.pais||'—'} · ${fmtK(d.kg)} · hasta W${lastWn}</div>
      <div class="kr" style="margin-top:10px">
        <div class="kpi"><div class="kn" style="color:#1a5276">${kK(d.kg)}${UKG}</div><div class="kl">Total</div></div>
        <div class="kpi"><div class="kn">${Object.keys(d.solapas).length}</div><div class="kl">Solapas</div></div>
        <div class="kpi"><div class="kn">${totalG}</div><div class="kl">Productos</div></div>
        <div class="kpi"><div class="kn">W${lastWn}</div><div class="kl">Último desp.</div></div>
      </div>
      ${clientesHtml}
      <div class="sc" style="margin-top:10px">Productos — clic para ver semanas y detalle de solapa</div>
      ${sections}
    </div>`;
}

/* ===== Solapa 481 (Marítimo / Aéreo / Full Levy) ===== */
function set481(){ mode='481'; curSol='R&L W'; curGenIdx=-1; curCliIdx=-1; openGenKey=''; srch=''; const si=document.getElementById('ssi'); if(si) si.value=''; renderNav(); renderMBF(); renderSb(); renderMain(); }
function modal481(wn){ if(wn>=31&&wn<=33) return ['Marítimo 481','🚢','#27ae60','#fff']; if(wn>=34&&wn<=38) return ['Aéreo 481','✈️','#f1c40f','#1a2a3a']; return ['Full Levy','▫️','#c0392b','#fff']; }
// Datos 481 — carga manual, editable en pantalla
const DATA481={
  maritimo:[
    {sem:'W31',rl:20,sets:40},
    {sem:'W32',rl:20,sets:30},
    {sem:'W33',rl:30,sets:30},
  ],
  aereo:[
    {sem:'W35',rl:15,sets:0},
    {sem:'W36',rl:30,sets:50},
    {sem:'W37',rl:30,sets:26},
    {sem:'W38',rl:30,sets:0},
  ],
  fulllevy:[
    {sem:'W29',rl:0,sets:0},
    {sem:'W30',rl:0,sets:0},
    {sem:'W39',rl:0,sets:0},
    {sem:'W40',rl:0,sets:0},
    {sem:'W41',rl:0,sets:0},
  ]
};
function calc481(){
  const INP=id=>{const el=document.getElementById(id);return el?parseFloat(el.value)||0:0;};
  // marítimo
  let mRL=0,mSets=0;
  DATA481.maritimo.forEach((_,i)=>{mRL+=INP('m_rl_'+i);mSets+=INP('m_sets_'+i);});
  // aéreo
  let aRL=0,aSets=0;
  DATA481.aereo.forEach((_,i)=>{aRL+=INP('a_rl_'+i);aSets+=INP('a_sets_'+i);});
  // full levy
  let fRL=0,fSets=0;
  DATA481.fulllevy.forEach((_,i)=>{fRL+=INP('f_rl_'+i);fSets+=INP('f_sets_'+i);});
  const fmtT=v=>v>0?v.toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:1})+' t':'—';
  // totales marítimo
  const mT=mRL+mSets, aT=aRL+aSets;
  const el=id=>document.getElementById(id);
  if(el('m_tot_rl')) el('m_tot_rl').textContent=mRL>0?mRL+' t':'—';
  if(el('m_tot_sets')) el('m_tot_sets').textContent=mSets>0?mSets+' t':'—';
  if(el('m_tot_total')) el('m_tot_total').textContent=(mT>0?mT+' t':'—');
  if(el('a_tot_rl')) el('a_tot_rl').textContent=aRL>0?aRL+' t':'—';
  if(el('a_tot_sets')) el('a_tot_sets').textContent=aSets>0?aSets+' t':'—';
  if(el('a_tot_total')) el('a_tot_total').textContent=(aT>0?aT+' t':'—');
  if(el('f_tot_rl')) el('f_tot_rl').textContent=fRL>0?fRL+' t':'—';
  if(el('f_tot_sets')) el('f_tot_sets').textContent=fSets>0?fSets+' t':'—';
}
function render481(){
  const IS="background:transparent;border:none;border-bottom:2px solid #c8a84b;font:inherit;font-weight:800;font-size:18px;color:inherit;width:70px;text-align:right;outline:none;padding:0";
  const inp=(id,val,col)=>`<input id="${id}" value="${val||''}" oninput="calc481()" inputmode="decimal" placeholder="0" style="${IS};color:${col||'inherit'}">`;

  const rowM=(d,i)=>`<tr style="border-bottom:1px solid #e8f0f8">
      <td style="padding:12px 16px;font-weight:800;font-size:16px;color:#1a2a3a;width:65px">${d.sem}</td>
      <td style="padding:12px 16px;text-align:right">${inp('m_rl_'+i, d.rl||'','#1a5276')}<span style="font-size:12px;color:#1a5276;font-weight:700;margin-left:4px">t R&L</span></td>
      <td style="padding:12px 16px;text-align:right">${inp('m_sets_'+i, d.sets||'','#c9a227')}<span style="font-size:12px;color:#c9a227;font-weight:700;margin-left:4px">t Sets</span></td>

  for(const {sol,cut} of cuts){ const gd=SOL[sol]&&SOL[sol].g[cut]; if(!gd) continue;
    for(const w of weeks){ const wd=gd.w['W'+w]; if(!wd) continue;
      for(const e of wd.e){
        const isVenta=(e.t==='V'||e.t==='C');           // pool = venta real
        if(mode==='V' && !isVenta) continue;
        if(mode==='R' && e.t!=='R') continue;            // mode 'T' => todo
        let label, flag=e.f||'';
        if(e.t==='C'){ label=(e.c||e.p||'Pool'); }
        else if(e.t==='R'){ label=(e.c||e.p||'Reserva')+(mode==='T'?' · reserva':''); }
        else { label=(e.c||e.p||'Sin cliente'); }
        const k=label+'|'+e.t;
        if(!buckets[k]) buckets[k]={label,flag,t:e.t,kg:0};
        buckets[k].kg+=e.kg;
      }
    }
  }
  return Object.values(buckets).filter(b=>b.kg>0).sort((a,b)=>b.kg-a.kg);
}
function ventasShare(items, color){
  const tot=items.reduce((a,b)=>a+b.kg,0);
  if(tot<=0) return {tot:0, strip:'', rows:'<div style="color:#aaa;font-size:12px;padding:18px 0;text-align:center">Sin ventas registradas<br>para este corte en la ventana</div>'};
  // top 8 + "otros"
  let list=items; if(items.length>8){ const top=items.slice(0,8); const restKg=items.slice(8).reduce((a,b)=>a+b.kg,0); list=[...top,{label:'Otros ('+(items.length-8)+')',flag:'',t:'V',kg:restKg,otros:true}]; }
  const op=i=>Math.max(0.32, 1 - i*0.12);
  const strip = list.map((b,i)=>{const pct=b.kg/tot*100; return `<div title="${b.label}: ${fmtT(b.kg)} t" style="width:${pct.toFixed(2)}%;background:${color};opacity:${op(i)}"></div>`;}).join('');
  const rows = list.map((b,i)=>{const pct=b.kg/tot*100; const pr=pct>=1?Math.round(pct):pct.toFixed(1); const tn=fmtT(b.kg);
    const nm = b.otros?`<span style="color:#999;font-style:italic">${b.label}</span>`:`${b.flag?fe(b.flag)+' ':''}${b.label}${b.t==='R'?' <span style="color:#e67e22;font-size:8px;font-weight:800">RES</span>':''}`;
    return `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;gap:6px;margin-bottom:3px;align-items:baseline">
        <span style="font-size:11px;font-weight:600;color:#1a2a3a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">${nm}</span>
        <span style="font-size:11px;font-weight:800;color:#1a2a3a;white-space:nowrap">${tn}<span style="font-size:9px;color:#999;font-weight:600"> t</span> · ${pr}%</span>
      </div>
      <div style="height:6px;background:#eef2f6;border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct.toFixed(2)}%;background:${color};opacity:${op(i)};border-radius:4px"></div></div>
    </div>`;}).join('');
  return {tot, strip:`<div style="display:flex;height:9px;border-radius:5px;overflow:hidden;margin-bottom:14px;background:#eef2f6">${strip}</div>`, rows};
}
function saldoCol(asign,p){ if(p<=0) return asign>0?CV:CN_; const pct=asign/p; if(pct>=0.95)return CV; if(pct>=0.70)return CPART; if(pct>=0.40)return CNF; return CN_; }
function irAFalta(i){ const r=faltaRank[i]; if(!r) return; mode='sol'; curSol=r.sol; mbF='both'; const idx=SOL[r.sol].go.indexOf(r.cut); renderNav(); renderMBF(); curGenIdx=idx; renderSb(); renderMain(); }
function renderFalta(){
  const wStart=Math.max(WK[0],curWeek());
  const wEnd=Math.min(WK[WK.length-1],wStart+FALTA_SPAN-1);
  const WKf=WK.filter(w=>w>=Math.max(faltaFrom,wStart)&&w<=wEnd);
  const ALL=Object.keys(SOL);
  const solsView = faltaSol==='Todas' ? ALL : [faltaSol];
  const porGen = faltaSol!=='Todas';
  // colocado: si faltaRes está apagado, la reserva NO cuenta como colocado (pasa a falta)
  const asignOf = wd => wd.e.reduce((a,e)=>a+((e.t==='R'&&!faltaRes)?0:e.kg),0);

  // KPIs + ranking (alcance segun solapa elegida)
  let TP=0, TF=0; faltaRank=[];
  for(const sol of solsView){ for(const cut of SOL[sol].go){ const gd=SOL[sol].g[cut];
    for(const w of WKf){ const wd=gd.w['W'+w]; if(!wd) continue;
      const asign=asignOf(wd); const saldoBruto=Math.max(0,wd.p-asign);
      // MB2 de R&L W: degradado a MB1, no es hueco real
      const esMB2RLW = sol==='R&L W' && cut.includes('__MB2');
      const saldo = esMB2RLW ? 0 : saldoBruto;
      TP+=wd.p; TF+=saldo;
      if(saldo>0) faltaRank.push({sol,cut,w,saldo,p:wd.p,asign});
    }}}
  faltaRank.sort((x,y)=>y.saldo-x.saldo);
  const TC=TP-TF, pf=TP>0?Math.round(TF/TP*100):0;

  // corte seleccionado para la torta (por defecto, el más vendido de la solapa)
  if(porGen){
    if(!SOL[faltaSol].go.includes(faltaGen)){
      let best=SOL[faltaSol].go[0], bestKg=-1;
      for(const cut of SOL[faltaSol].go){ let k=0; for(const w of WKf){const wd=SOL[faltaSol].g[cut].w['W'+w]; if(wd) k+=wd.e.reduce((a,e)=>a+(e.t!=='R'?e.kg:0),0);} if(k>bestKg){bestKg=k;best=cut;} }
      faltaGen=best;
    }
  } else { faltaGen=null; }

  // filas de la grilla: por solapa (Todas) o por generico (solapa elegida)
  const rows=[];
  if(porGen){
    const sol=faltaSol;
    const isRLW = sol==='R&L W';
    const deg = (isRLW && SOL[sol].deg) ? SOL[sol].deg : {};
    SOL[sol].go.forEach((cut,ci)=>{
      const isMB2 = cut.includes('__MB2');
      const genBase = cut.replace('__MB2','');
      const per={};
      for(const w of WKf){
        const wd=SOL[sol].g[cut] ? SOL[sol].g[cut].w['W'+w] : null;
        if(!wd){ per[w]={p:0,asign:0,degKg:0}; continue; }
        const asignReal=asignOf(wd);
        const degKg = (!isMB2 && isRLW) ? ((deg['W'+w]&&deg['W'+w][genBase])||0) : 0;
        // MB2 de R&L W: el saldo está cubierto por MB1, no mostrar como disponible
        const asign = (isMB2 && isRLW) ? wd.p : asignReal;
        per[w]={p:wd.p, asign, degKg};
      }
      rows.push({label:cut.replace(/^G /,'').replace('__MB2',' · MB2'), badge:SC[sol]||'#555', per, isRLW, onclick:`selectFaltaGen(${ci})`, sel:cut===faltaGen});
    });
  } else {
    for(const sol of ALL){ const per={};
      for(const cut of SOL[sol].go) for(const w of WKf){ const wd=SOL[sol].g[cut].w['W'+w]; if(!wd) continue; const asign=asignOf(wd); const x=per[w]||(per[w]={p:0,asign:0}); x.p+=wd.p; x.asign+=asign; }
      rows.push({label:sol, badge:SC[sol]||'#555', per, onclick:`setFaltaSol('${sol}')`, sel:false});
    }
  }

  const head=`<th style="width:1%;padding:5px 6px;text-align:left;font-size:10px;color:#fff;white-space:nowrap">${porGen?'Corte':'Solapa'}</th>`+WKf.map(w=>`<th style="padding:5px 4px;font-size:10px;color:#fff;text-align:center">${w}</th>`).join('');
  const body=rows.map(r=>{
    const cells=WKf.map(w=>{
      const a=r.per[w];
      if(!a||a.p<=0) return `<td style="padding:0"><div style="height:24px;background:#eef2f6;border-radius:3px;margin:1px"></div></td>`;

      const saldo=Math.max(0,a.p-a.asign);
      const col=saldoCol(a.asign,a.p); const txt=col===CPART?'#1a2a3a':'#fff';
      const lbl=saldo>0?fmtT(saldo):''; const pctF=Math.round(saldo/a.p*100);
      // Degradado MB2 (solo R&L W)
      const degKg=r.isRLW?(a.degKg||0):0;
      const degTxt=degKg>0?`↓ ${fmtT(degKg)}t MB2`:'';
      const h=degTxt?36:24;
      return `<td style="padding:1px"><div title="W${w}${saldo>0?' — falta '+fmt(saldo)+' kg ('+pctF+'%)':''}${degKg>0?' · degradó '+fmtT(degKg)+'t MB2':''}" style="height:${h}px;background:${col};color:${txt};border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0px;font-size:10px;font-weight:700">
        ${lbl?`<span>${lbl}</span>`:''}
        ${degTxt?`<span style="font-size:8px;opacity:.85;font-weight:600">${degTxt}</span>`:''}
      </div></td>`;
    }).join('');
    const selBg=r.sel?'background:#fdecea;':'';
    const lblTd=`<td style="${selBg}width:1%;padding:3px 6px;font-weight:700;font-size:11px;color:#1a2a3a;white-space:nowrap"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${r.badge};margin-right:5px"></span>${r.sel?'▸ ':''}${r.label}</td>`;
    return `<tr onclick="${r.onclick}" style="cursor:pointer;${selBg}">${lblTd}${cells}</tr>`;
  }).join('');

  const top=faltaRank.slice(0,30);
  const rk=top.map((r,i)=>{const pctF=Math.round(r.saldo/r.p*100); const col=saldoCol(r.asign,r.p);
    return `<tr onclick="irAFalta(${i})" style="cursor:pointer;border-bottom:1px solid #eef2f6" onmouseover="this.style.background='#f6f9fc'" onmouseout="this.style.background=''">
      <td style="padding:6px 8px;color:#aaa;font-weight:700;font-size:11px">${i+1}</td>
      <td style="padding:6px 8px"><span style="font-size:9px;font-weight:700;padding:1px 7px;border-radius:9px;background:${SC[r.sol]||'#555'};color:#fff">${r.sol}</span></td>
      <td style="padding:6px 8px;font-weight:600;color:#1a2a3a">${r.cut.replace(/^G /,'').replace('__MB2',' MB2')}</td>
      <td style="padding:6px 8px;font-weight:700;color:#888">W${r.w}</td>
      <td style="padding:6px 8px;text-align:right;font-weight:800;color:#1a2a3a">${fmt(r.saldo)} <span style="font-size:9px;color:#999;font-weight:600">kg</span></td>
      <td style="padding:6px 8px;text-align:right"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${col};margin-right:5px;vertical-align:middle"></span><b style="color:#c0392b">${pctF}%</b></td>
    </tr>`;
  }).join('');

  const chipW=(w,lbl)=>`<button onclick="setFaltaFrom(${w})" style="padding:3px 11px;border-radius:14px;border:1px solid ${faltaFrom===w?'#c0392b':'#c8d8e8'};background:${faltaFrom===w?'#c0392b':'#fff'};color:${faltaFrom===w?'#fff':'#666'};font-size:11px;font-weight:600;cursor:pointer">${lbl}</button>`;
  const chipS=(sol)=>`<button onclick="setFaltaSol('${sol}')" style="padding:3px 11px;border-radius:14px;border:1px solid ${faltaSol===sol?(SC[sol]||'#1a3a5c'):'#c8d8e8'};background:${faltaSol===sol?(SC[sol]||'#1a3a5c'):'#fff'};color:${faltaSol===sol?'#fff':'#666'};font-size:11px;font-weight:600;cursor:pointer">${sol==='Todas'?'Todas':sol}</button>`;

  // ----- Panel: vendido por cliente/destino del corte elegido -----
  if(faltaPieWeek && !WKf.includes(faltaPieWeek)) faltaPieWeek=null;   // semana fuera de la ventana
  const pieWeeks = faltaPieWeek ? [faltaPieWeek] : WKf;
  const pieCuts = porGen ? [{sol:faltaSol, cut:faltaGen}] : ALL.flatMap(s=>SOL[s].go.map(c=>({sol:s,cut:c})));
  const pieItems = pieVendido(pieCuts, pieWeeks, faltaPieType);
  const pieTitle = porGen ? (faltaGen||'').replace(/^G /,'').replace('__MB2',' MB2') : 'Todas las solapas';
  const solColor = (porGen && SC[faltaSol]) ? SC[faltaSol] : '#1a5276';
  const sh = ventasShare(pieItems, solColor);
  const wkLabel = faltaPieWeek ? ('W'+faltaPieWeek) : ('W'+wStart+'–W'+wEnd);
  const tChip=(t,lbl)=>`<button onclick="setFaltaPieType('${t}')" style="flex:1;padding:5px 4px;border:1px solid ${faltaPieType===t?solColor:'#d8e0e8'};background:${faltaPieType===t?solColor:'#fff'};color:${faltaPieType===t?'#fff':'#888'};font-size:10px;font-weight:700;cursor:pointer">${lbl}</button>`;
  const typeSel=`<div style="display:flex;border-radius:8px;overflow:hidden;margin-bottom:8px">${tChip('V','Ventas')}${tChip('R','Reservas')}${tChip('T','Todo')}</div>`;
  const weekSel=`<select onchange="setFaltaPieWeek(this.value)" style="width:100%;font-size:11px;padding:5px 7px;border:1px solid #d8e0e8;border-radius:8px;background:#fff;color:#1a2a3a;margin-bottom:13px;cursor:pointer">
      <option value="all" ${!faltaPieWeek?'selected':''}>Todas las semanas (${'W'+wStart}–W${wEnd})</option>
      ${WKf.map(w=>`<option value="${w}" ${faltaPieWeek===w?'selected':''}>Semana W${w}</option>`).join('')}
    </select>`;
  const piePanel = `
    <div style="flex:0 0 26%;min-width:230px;background:#fff;border:1px solid #e1e8ef;border-radius:11px;padding:14px 15px;box-shadow:0 1px 3px rgba(0,0,0,.04)">
      <div style="font-size:9px;font-weight:800;letter-spacing:1px;color:#aaa;text-transform:uppercase;margin-bottom:5px">${faltaPieType==='R'?'Reservado':faltaPieType==='T'?'Colocado':'Vendido'} por cliente</div>
      <div style="font-size:13px;font-weight:800;color:${solColor};line-height:1.2;margin-bottom:10px">${pieTitle}</div>
      ${typeSel}${weekSel}
      <div style="display:flex;align-items:baseline;gap:5px;margin-bottom:12px"><span style="font-size:26px;font-weight:800;color:#1a2a3a;line-height:1">${fmtT(sh.tot)}</span><span style="font-size:10px;color:#999">ton · ${wkLabel}</span></div>
      ${sh.strip}${sh.rows}
    </div>`;

  document.getElementById('main').innerHTML=`
    <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1 1 68%;min-width:340px">
        <div style="display:flex;gap:5px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
          <span style="font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-right:2px">Solapa</span>
          ${['Todas','PECHO','RUEDA','ASADO','R&L W','R&L HILTON'].map(chipS).join('')}
        </div>
        <div style="display:flex;gap:5px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
          <span style="font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-right:2px">Desde semana</span>
          ${chipW(wStart,'Todas')}${chipW(wStart+3,'≥ W'+(wStart+3))}${chipW(wStart+6,'≥ W'+(wStart+6))}
          <span style="font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:0 2px 0 14px">Reservas</span>
          <button onclick="toggleFaltaRes()" style="padding:4px 13px;border-radius:14px;border:1px solid ${faltaRes?'#e67e22':'#c8d8e8'};background:${faltaRes?'#e67e22':'#fff'};color:${faltaRes?'#fff':'#666'};font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap">${faltaRes?'✓ contadas como colocado':'no contar (mostrar como falta)'}</button>
        </div>
        <div class="sc">Mapa de huecos — falta vender ${porGen?'por corte':'por solapa'} y semana${porGen?' · '+faltaSol:''} · <span style="color:#c0392b">W${wStart}–W${wEnd}</span></div>
        ${faltaSol==='R&L W'?`<div style="font-size:10px;color:#888;margin-bottom:6px">↓ Xt MB2 = toneladas degradadas de MB2 a MB1 en esa semana</div>`:''}
        <div style="font-size:10px;color:#888;margin:-4px 0 8px;line-height:1.4"><span style="color:#c0392b;font-weight:700">Valores en TONELADAS (miles de kg).</span> \"Falta vender\" = producción − (venta + pool${faltaRes?' + <b>reserva</b>); la <b>reserva se cuenta como colocada</b>.':'); las <b>reservas NO se cuentan</b> (aparecen como falta).'}</div>
        <div style="overflow-x:auto;margin-bottom:18px"><table style="border-collapse:collapse;width:100%"><thead><tr style="background:#1a3a5c">${head}</tr></thead><tbody>${body}</tbody></table></div>
        <div class="sc">🎯 Lo más urgente — corte + semana con más kg sin colocar (clic para ir al detalle)</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="background:#f4f6f9;color:#888;text-transform:uppercase;font-size:10px"><th style="padding:6px 8px;text-align:left">#</th><th style="padding:6px 8px;text-align:left">Solapa</th><th style="padding:6px 8px;text-align:left">Corte</th><th style="padding:6px 8px;text-align:left">Sem</th><th style="padding:6px 8px;text-align:right">Falta</th><th style="padding:6px 8px;text-align:right">% falta</th></tr></thead>
          <tbody>${rk||'<tr><td colspan="6" style="padding:14px;text-align:center;color:#27ae60;font-weight:600">✓ No hay saldo sin colocar en este rango</td></tr>'}</tbody>
        </table>
      </div>
      ${piePanel}
    </div>`;
}
function onSrch(){const el=document.getElementById('ssi');if(!el)return;srch=el.value.toLowerCase();renderSb();}

function syncHdrWeeks(){const el=document.getElementById('hdr-weeks');if(!el)return;const wS=Math.max(WK[0],curWeek());const wE=Math.min(WK[WK.length-1],wS+FALTA_SPAN-1);el.textContent=`W${wS}→W${wE}`;}
mode='falta';
syncHdrWeeks();
renderNav();renderMBF();renderSb();renderMain();
</script>
